<!doctype html>
<html lang="zh-CN" data-runtime="browser">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>光谱干涉智能解调系统</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <h1>光谱干涉智能解调系统</h1>
    <p>输入 10001 点原始光谱，查看光程差和距离</p>
    <nav class="nav"><a href="./">解调工作台</a><a href="./source.html">源码与模型</a></nav>
  </header>
  <main class="wrap">
    <section class="card" aria-labelledby="input-title">
      <h2 id="input-title">选择模型和光谱</h2>
      <p class="hint">每条光谱须有 <b>10001 点</b>，波长按 <b>1510–1610 nm、间隔 0.01 nm</b> 递增。CSV、TXT、DAT、TSV、PRN 读取波长和强度两列。也支持 XLSX、XLSM、NPY、NPZ 和 JSON。</p>
      <p class="hint" id="processing-location"></p>
      <form id="demodulate-form" class="row">
        <div class="field">
          <label for="cnn-files">选择光谱文件</label>
          <input type="file" id="cnn-files" multiple accept=".csv,.txt,.dat,.tsv,.prn,.xlsx,.xlsm,.npy,.npz,.json">
        </div>
        <div class="field">
          <label for="cnn-dir">或选择文件夹</label>
          <input type="file" id="cnn-dir" webkitdirectory multiple>
        </div>
        <div class="field">
          <label for="cnn-model">解调模型</label>
          <select id="cnn-model">
            <option value="cnn">原始光谱 CNN</option>
            <option value="bilstm">原始光谱双向 LSTM</option>
          </select>
        </div>
        <button class="btn" type="submit" id="run-model">开始解调</button>
      </form>
      <p class="hint" id="cnn-file-count"></p>
      <p class="hint" id="cnn-status" role="status" aria-live="polite"></p>
      <ul class="error-list" id="input-errors" hidden></ul>
    </section>
    <section class="card" id="results-panel" aria-labelledby="results-title" hidden>
      <div class="result-heading">
        <h2 id="results-title">解调结果</h2>
        <button class="btn ghost" type="button" id="export-results">导出 CSV</button>
      </div>
      <p id="cnn-summary" class="hint"></p>
      <div class="scroll">
        <table id="cnn-table">
          <thead><tr><th scope="col">顺序</th><th scope="col">光谱来源</th><th scope="col">光程差（μm）</th><th scope="col">距离（μm）</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
